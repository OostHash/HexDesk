name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the required Frontend and Backend checks present on every PR, but only
  # install toolchains and run a suite for the side that changed. Shared files,
  # pushes and release PRs (to master) run both.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" || "$BASE_REF" == "master" ]]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          frontend=false
          backend=false
          while IFS= read -r path; do
            case "$path" in
              *.md|docs/*|.github/ISSUE_TEMPLATE/*) ;;
              src/frontend/*) frontend=true ;;
              src/backend/*) backend=true ;;
              # Everything else is shared: root manifests and lockfiles,
              # toolchain pins, and the workflows themselves.
              *) frontend=true; backend=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      # Checked out before anything else, so the report can be written even
      # when the checks are skipped or an early step fails.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1

      - name: No frontend changes
        if: needs.changes.outputs.frontend != 'true'
        run: echo "No frontend changes; frontend checks are not needed."

      - if: needs.changes.outputs.frontend == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0
      - if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - id: install
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm install --frozen-lockfile
      - id: browsers
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm --filter @hexdesk/frontend exec playwright install --with-deps chromium
      - id: format
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm format:check
      - id: lint
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm lint
      - id: typecheck
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm typecheck
      - id: test
        if: needs.changes.outputs.frontend == 'true'
        run: >-
          pnpm test:frontend --reporter=default --reporter=github-actions
          --reporter=json --outputFile.json="$RUNNER_TEMP/vitest.json"
      - id: build
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm build

      - name: Write report
        if: always()
        env:
          REPORT_JOB: Frontend
          REPORT_SKIPPED: >-
            ${{ needs.changes.result != 'success' && 'Change detection failed, so no checks ran.'
            || needs.changes.outputs.frontend != 'true' && 'This pull request changes no frontend or shared files.'
            || '' }}
          REPORT_STEPS: >-
            [
            {"name": "Install dependencies", "outcome": "${{ steps.install.outcome }}"},
            {"name": "Install Chromium", "outcome": "${{ steps.browsers.outcome }}"},
            {"name": "Format", "outcome": "${{ steps.format.outcome }}"},
            {"name": "Lint", "outcome": "${{ steps.lint.outcome }}"},
            {"name": "Typecheck", "outcome": "${{ steps.typecheck.outcome }}"},
            {"name": "Unit tests", "outcome": "${{ steps.test.outcome }}",
             "source": {"kind": "vitest", "file": "vitest.json"}},
            {"name": "Build", "outcome": "${{ steps.build.outcome }}"}
            ]
        run: node .github/scripts/ci-report/job.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-frontend
          path: ${{ runner.temp }}/ci-report/report.json
          retention-days: 7
          if-no-files-found: ignore

  backend:
    name: Backend
    needs: changes
    if: ${{ always() }}
    runs-on: windows-latest
    steps:
      # Checked out before anything else, so the report can be written even
      # when the checks are skipped or an early step fails.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1

      - name: No backend changes
        if: needs.changes.outputs.backend != 'true'
        run: echo "No backend changes; backend checks are not needed."

      - if: needs.changes.outputs.backend == 'true'
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - if: needs.changes.outputs.backend == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - id: fmt
        if: needs.changes.outputs.backend == 'true'
        run: cargo fmt --all -- --check
      - id: check
        if: needs.changes.outputs.backend == 'true'
        run: cargo check --workspace --all-targets
      - id: clippy
        if: needs.changes.outputs.backend == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - id: test
        if: needs.changes.outputs.backend == 'true'
        shell: bash
        run: cargo test --workspace 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"

      - name: Write report
        if: always()
        shell: bash
        env:
          REPORT_JOB: Backend
          REPORT_SKIPPED: >-
            ${{ needs.changes.result != 'success' && 'Change detection failed, so no checks ran.'
            || needs.changes.outputs.backend != 'true' && 'This pull request changes no backend or shared files.'
            || '' }}
          REPORT_STEPS: >-
            [
            {"name": "Format", "outcome": "${{ steps.fmt.outcome }}"},
            {"name": "Check", "outcome": "${{ steps.check.outcome }}"},
            {"name": "Clippy", "outcome": "${{ steps.clippy.outcome }}"},
            {"name": "Tests", "outcome": "${{ steps.test.outcome }}",
             "source": {"kind": "cargo-test", "file": "cargo-test.log"}}
            ]
        run: node .github/scripts/ci-report/job.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-backend
          path: ${{ runner.temp }}/ci-report/report.json
          retention-days: 7
          if-no-files-found: ignore
