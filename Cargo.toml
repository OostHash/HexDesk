[workspace]
members = ["src/backend", "src/backend/crates/*"]
resolver = "2"

[workspace.package]
version = "1.1.0"

[profile.dev]
incremental = false
opt-level = 1

# OCR inference is several times slower without full optimization, which
# makes overlay reads in a dev build far slower than in a release build.
# See https://github.com/robertknight/rten/blob/main/docs/performance.md
[profile.dev.package.ocrs]
opt-level = 3

[profile.dev.package.rten]
opt-level = 3

[profile.dev.package.rten-base]
opt-level = 3

[profile.dev.package.rten-gemm]
opt-level = 3

[profile.dev.package.rten-imageproc]
opt-level = 3

[profile.dev.package.rten-onnx]
opt-level = 3

[profile.dev.package.rten-parallel]
opt-level = 3

[profile.dev.package.rten-sequence]
opt-level = 3

[profile.dev.package.rten-shape-inference]
opt-level = 3

[profile.dev.package.rten-simd]
opt-level = 3

[profile.dev.package.rten-tensor]
opt-level = 3

[profile.dev.package.rten-vecmath]
opt-level = 3
