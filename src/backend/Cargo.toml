[package]
name = "hexdesk-backend"
version.workspace = true
description = "HexDesk desktop backend"
authors = ["HexDesk contributors"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/OostHash/HexDesk"

[lib]
name = "hexdesk_backend"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hexdesk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = ["image-png"] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["rt", "time", "net", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
memchr = "2"
ureq = { version = "2", features = ["json"] }
tungstenite = { version = "0.30", features = ["native-tls"] }
lzma-rs = "0.3"
hexdesk-blob = { path = "crates/blob" }
hexdesk-capture = { path = "crates/capture" }
hexdesk-diag = { path = "crates/diag" }
hexdesk-items = { path = "crates/items" }
hexdesk-logging = { path = "crates/logging" }
hexdesk-overlays = { path = "crates/overlays" }
hexdesk-persist = { path = "crates/persist" }
hexdesk-player = { path = "crates/player" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-snap-layout = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_Globalization",
] }
