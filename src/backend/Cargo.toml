[package]
name = "hexdesk-backend"
version.workspace = true
description = "HexDesk desktop backend"
authors = ["HexDesk contributors"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/OostHash/HexDesk"

[lib]
name = "hexdesk_backend"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hexdesk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = ["image-png"] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["rt", "time", "net", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
regex = "1"
# Same version as Tauri uses, for window handles that work on every platform.
raw-window-handle = "0.6"
jiff = "1"
dirs = "7"
memchr = "2"
ureq = { version = "3", features = ["json"] }
tungstenite = { version = "0.30", features = ["native-tls"] }
lzma-rs = "0.3"
hexdesk-blob = { path = "crates/blob" }
hexdesk-capture = { path = "crates/capture" }
hexdesk-diag = { path = "crates/diag" }
hexdesk-items = { path = "crates/items" }
hexdesk-logging = { path = "crates/logging" }
hexdesk-overlays = { path = "crates/overlays" }
hexdesk-persist = { path = "crates/persist" }
hexdesk-platform = { path = "crates/platform" }
hexdesk-player = { path = "crates/player" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-snap-layout = "1"
