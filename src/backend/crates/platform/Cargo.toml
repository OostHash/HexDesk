[package]
name = "hexdesk-platform"
version.workspace = true
description = "HexDesk code that differs per operating system, behind one interface"
authors = ["HexDesk contributors"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/OostHash/HexDesk"
publish = false

[lib]
name = "hexdesk_platform"

# Same versions and features as the backend crate, so the lock file gains no
# new packages.
[dependencies]
dirs = "7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
