[package]
name = "hexdesk-diag"
version.workspace = true
description = "HexDesk diagnostics: typed errors, structured log entries and redaction"
authors = ["HexDesk contributors"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/OostHash/HexDesk"
publish = false

[lib]
name = "hexdesk_diag"

# Same versions and features as the backend crate, so the lock file gains no
# new packages.
[dependencies]
jiff = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Both already in the lock file through other dependencies, so no new packages
# are added. `zip` writes the diagnostics export; `flate2` is listed only to
# select its default pure-Rust backend (miniz_oxide) for zip's deflate.
flate2 = "1"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

[package.metadata.cargo-machete]
# Feature-only dependency: its default enables flate2's pure-Rust miniz backend
# for zip's `deflate-flate2` feature.
ignored = ["flate2"]
